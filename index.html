<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2416">
<meta name="description" content="VEXORA MARKET - السوق الشامل، سوق واحد، خيارات بلا حدود">
<title>VEXORA MARKET | سوق واحد، خيارات بلا حدود</title>

<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">

<meta property="og:type" content="website">
<meta property="og:site_name" content="VEXORA MARKET">
<meta property="og:title" content="VEXORA MARKET | سوق واحد، خيارات بلا حدود">
<meta property="og:description" content="السوق الشامل في الجزائر: سيارات، عقارات، إلكترونيات، مواشي، خدمات وأكثر">
<meta property="og:image" content="banner.jpg">
<meta property="og:locale" content="ar_DZ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a2416; --bg2:#06170e;
  --gold:#f2b632; --gold2:#c98a12;
  --gold-grad:linear-gradient(135deg,#f9d26a,#d9961a);
  --muted:#a9c4b4; --line:#2a6446;
  --wa:#25d366; --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:#031009;color:#fff;min-height:100vh;display:flex;justify-content:center}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

.app{width:100%;max-width:440px;min-height:100vh;position:relative;padding-bottom:104px;overflow-x:hidden;
  background:radial-gradient(120% 55% at 50% 0%,#17562f 0%,var(--bg) 42%,var(--bg2) 100%)}

.top{direction:ltr;display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--gold);cursor:pointer}
.bell svg{width:30px;height:30px}
.count{position:absolute;top:0;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;display:none;place-items:center;border:2px solid var(--bg)}
.brand{display:flex;justify-content:center;align-items:center}
.logo-wrap{width:104px;height:104px;border-radius:50%;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.45),0 0 0 2px #f2b63655;background:#0a2a6b}
.logo-img{width:100%;height:100%;object-fit:cover;transform:scale(1.08)}
.flag{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid #fff3;background:#fff;display:grid;place-items:center;font-size:22px;cursor:pointer}

.search{direction:ltr;display:flex;gap:10px;align-items:center;padding:10px 16px 14px}
.filter-btn{flex:0 0 auto;height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--gold);color:var(--gold);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;background:#0a2a1a}
.search-box{flex:1;height:50px;background:#fff;border-radius:14px;display:flex;align-items:center;padding:0 14px;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.search-box input{flex:1;border:0;outline:0;font-family:inherit;font-size:16px;color:#1b2a20;background:transparent;min-width:0}
.search-box input::placeholder{color:#7a8a80}
.search-box svg{color:#1b2a20;flex:0 0 auto}

.stats{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 14px}
.stat{background:linear-gradient(180deg,#0f3a25,#0b2b1b);border:1.5px solid var(--gold2);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:inset 0 0 0 1px #ffffff10,0 0 14px rgba(242,182,50,.12)}
.stat .ic{font-size:22px;line-height:1;margin-bottom:6px}
.stat b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.stat small{display:block;color:var(--muted);font-size:13px;margin-top:2px;font-weight:600}

.panel{margin:0 12px 14px;padding:14px 10px 12px;border-radius:20px;background:linear-gradient(180deg,#0c2f1e,#082014);border:1px solid #1f5538}
.sec-head{direction:ltr;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sec-head h2{direction:rtl;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec-head h2 i{font-style:normal;color:var(--gold);font-size:18px}
.more{border:1.5px solid var(--gold);color:var(--gold);border-radius:12px;padding:6px 14px;font-weight:700;font-size:14px;background:#0a2a1a}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:linear-gradient(180deg,#fff7df,#efd9a3);border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.25);display:flex;flex-direction:column;transition:transform .15s}
.cat:active{transform:scale(.97)}
.cat .ico{height:72px;display:grid;place-items:center;font-size:44px;line-height:1}
.cat span{display:block;background:linear-gradient(180deg,#f4e3b4,#e7cd8a);color:#2a1a00;font-weight:800;font-size:14px;padding:7px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat.on{outline:2.5px solid var(--gold);outline-offset:2px}

.banner-wrap{position:relative;margin:0 12px 14px}
.banner-img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;border:1px solid #2f8a55;box-shadow:0 8px 20px rgba(0,0,0,.35);cursor:pointer}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:7px;direction:ltr}
.dots span{width:7px;height:7px;border-radius:50%;background:#ffffff66}
.dots span.on{background:var(--gold)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{background:#fff;border-radius:14px;overflow:hidden;color:#1b2a20;box-shadow:0 6px 14px rgba(0,0,0,.25);cursor:pointer;display:flex;flex-direction:column}
.c-img{position:relative;height:96px;display:grid;place-items:center;background:linear-gradient(160deg,#cfe9d4,#8fc79c);overflow:hidden}
.c-img img{width:100%;height:100%;object-fit:cover}
.c-emoji{font-size:44px;line-height:1}
.c-badge{position:absolute;top:6px;right:6px;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.b-feat{background:#1f8a4c}
.b-urg{background:var(--danger)}
.b-sale{background:#2d9c57}
.heart{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:#ffffffdd;display:grid;place-items:center;font-size:14px;color:#1b2a20}
.c-body{padding:8px 8px 10px;text-align:right}
.c-title{font-size:13px;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px}
.c-price{color:#15883f;font-weight:900;font-size:15px;direction:ltr;text-align:right}
.c-price small{font-size:11px;color:#15883f;margin-right:2px}
.c-loc{font-size:12px;color:#5b6b61;font-weight:600;margin-top:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:22px 8px;font-size:15px}

.bnav{direction:ltr;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:76px;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;z-index:100;
  background:linear-gradient(180deg,#0e3a24,#082214);border-top:1px solid #1f5538;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;color:#c6d9cc;font-size:13px;font-weight:700;flex:1;position:relative}
.nav svg{width:24px;height:24px}
.nav.on{color:var(--gold)}
.add{flex:0 0 auto;width:62px;height:62px;margin-top:-30px;border-radius:50%;background:var(--gold-grad);display:grid;place-items:center;color:#2a1a00;font-size:34px;font-weight:900;box-shadow:0 6px 18px rgba(242,182,50,.45);border:4px solid #082214;cursor:pointer;line-height:1}

dialog{border:0;border-radius:20px;padding:0;width:calc(100% - 24px);max-width:440px;max-height:88vh;background:#0c2f1e;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
.dlg{padding:18px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dlg-head h2{font-size:20px;font-weight:900}
.x{width:36px;height:36px;border-radius:50%;background:#14402a;font-size:22px;display:grid;place-items:center}
.field{margin-bottom:12px}
.field label{display:block;font-weight:700;margin-bottom:5px;font-size:14px;color:#dbeadf}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#14402a;color:#fff;font-family:inherit;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=file]{padding:9px}
input[type=checkbox]{width:auto;accent-color:var(--gold)}
textarea{resize:vertical;min-height:90px}
select option{background:#14402a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#ff7b7b;font-size:13px;margin-top:4px;min-height:1em}
.btn-gold{display:block;width:100%;padding:13px;border-radius:12px;background:var(--gold-grad);color:#2a1a00;font-weight:900;font-size:16px;text-align:center;margin-top:8px}
.btn-gold:disabled{opacity:.6}
.btn-wa{display:block;text-align:center;padding:13px;border-radius:12px;background:var(--wa);color:#fff;font-weight:800;font-size:16px;margin-bottom:10px}
.btn-del{display:block;width:100%;padding:12px;border-radius:12px;background:var(--danger);color:#fff;font-weight:800;font-size:15px;margin-top:10px}
.btn-interest{display:block;width:100%;padding:13px;border-radius:12px;background:var(--gold-grad);color:#2a1a00;font-weight:900;font-size:16px;margin-bottom:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab{padding:10px;border-radius:10px;background:#14402a;font-weight:800;color:#c6d9cc}
.tab.on{background:var(--gold-grad);color:#2a1a00}
.detail-img{width:100%;height:220px;border-radius:14px;margin-bottom:12px;background:linear-gradient(160deg,#cfe9d4,#8fc79c);display:grid;place-items:center;font-size:80px;overflow:hidden}
.detail-img img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.d-price{color:var(--wa);font-size:24px;font-weight:900;direction:ltr;text-align:right;margin-bottom:6px}
.d-meta{color:var(--muted);margin-bottom:8px;font-size:15px}
.d-comm{background:#3a2a06;color:#ffd77a;border:1px solid #7a5a12;border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;margin-bottom:10px;line-height:1.6}
.d-comm small{display:block;font-weight:500;color:#e7c98a;font-size:12px;margin-top:2px}
.d-desc{line-height:1.7;margin-bottom:16px;white-space:pre-wrap;word-break:break-word}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:#dbeadf;line-height:1.6;margin:6px 0 4px}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}

.lead{background:#14402a;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.lead h4{font-size:16px;font-weight:800;margin-bottom:6px}
.lead-meta{font-size:13px;color:#c6d9cc;margin-bottom:4px;line-height:1.6}
.lead-links{display:flex;gap:8px;margin:8px 0}
.lead-links a{flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--wa);color:#fff;font-weight:800;font-size:13px}
.lead-bar{display:flex;gap:8px;margin-bottom:10px}
.lead-bar select{flex:1}
.lead-stats{font-size:14px;color:var(--muted);margin-bottom:10px;font-weight:700}

#toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,30px);background:#fff;color:#111;padding:10px 20px;border-radius:22px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;z-index:300;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <button class="bell" aria-label="الإشعارات" id="bellBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="count" id="bellCount">0</span>
    </button>
    <div class="brand">
      <div class="logo-wrap"><img class="logo-img" src="logo.jpg" alt="VEXORA MARKET - سوق واحد، خيارات بلا حدود"></div>
    </div>
    <button class="flag" aria-label="الجزائر">🇩🇿</button>
  </header>

  <div class="search">
    <button class="filter-btn" id="filterBtn" aria-label="فلاتر">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      فلاتر
    </button>
    <label class="search-box">
      <input type="search" id="q" placeholder="ابحث عن منتج أو خدمة..." autocomplete="off" maxlength="80">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    </label>
  </div>

  <section class="stats">
    <div class="stat"><div class="ic">👥</div><b>+250K</b><small>مستخدم نشط</small></div>
    <div class="stat"><div class="ic">📢</div><b>+75K</b><small>إعلان منشور</small></div>
    <div class="stat"><div class="ic">📍</div><b>58</b><small>ولاية</small></div>
  </section>

  <section class="panel">
    <div class="sec-head">
      <button class="more" id="clearCat">عرض الكل</button>
      <h2><i>▦</i> التصنيفات الرئيسية</h2>
    </div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="banner-wrap">
    <img class="banner-img" id="promoBanner" src="banner.jpg" alt="VEXORA MARKET - السوق الشامل، سوق واحد، خيارات بلا حدود">
    <div class="dots"><span></span><span class="on"></span><span></span><span></span><span></span></div>
  </section>

  <section class="panel" style="margin-top:0">
    <div class="sec-head">
      <button class="more" id="clearAll">عرض الكل</button>
      <h2><i>★</i> إعلانات مميزة</h2>
    </div>
    <div class="grid" id="grid"></div>
  </section>

</div>

<nav class="bnav">
  <button class="nav on" id="navHome">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    الرئيسية
  </button>
  <button class="nav" id="navCats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
    الأقسام
  </button>
  <button class="add" id="navAdd" aria-label="إضافة إعلان">＋</button>
  <button class="nav" id="navChats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    المحادثات
  </button>
  <button class="nav" id="navAccount">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
    حسابي
  </button>
</nav>

<dialog id="postDlg">
  <div class="dlg">
    <div class="dlg-head"><h2>إعلان جديد</h2><button class="x" data-close="postDlg" aria-label="إغلاق">×</button></div>
    <form id="postForm" novalidate>
      <div class="field"><label for="fTitle">عنوان الإعلان</label><input id="fTitle" maxlength="120" placeholder="مثال: هاتف سامسونج"><div class="err" id="e-title"></div></div>
      <div class="row">
        <div class="field"><label for="fPrice">السعر (د.ج)</label><input id="fPrice" inputmode="numeric" placeholder="15000"><div class="err" id="e-price"></div></div>
        <div class="field"><label for="fCat">التصنيف</label><select id="fCat"></select><div class="err" id="e-cat"></div></div>
      </div>
      <div class="row">
        <div class="field"><label for="fWilaya">الولاية</label><select id="fWilaya"></select><div class="err" id="e-wilaya"></div></div>
        <div class="field"><label for="fBadge">الشارة</label>
          <select id="fBadge"><option value="">بدون شارة</option><option value="featured">⭐ مميز</option><option value="urgent">🔥 عاجل</option><option value="sale">للبيع</option></select>
        </div>
      </div>
      <div class="row">
        <div class="field"><label for="fCommType">عمولة الوسيط (تظهر لك فقط)</label>
          <select id="fCommType"><option value="">بدون عمولة</option><option value="fixed">مبلغ ثابت (د.ج)</option><option value="percent">نسبة من السعر (%)</option></select>
        </div>
        <div class="field"><label for="fCommValue">قيمة العمولة</label><input id="fCommValue" inputmode="numeric" placeholder="مثال: 1000"><div class="err" id="e-comm"></div></div>
      </div>
      <div class="field"><label for="fPhone">رقم واتساب</label><input id="fPhone" type="tel" dir="ltr" placeholder="0555123456"><div class="err" id="e-phone"></div></div>
      <div class="field"><label for="fMedia">صورة المنتج (اختياري)</label><input id="fMedia" type="file" accept="image/*"><div class="err" id="e-media"></div></div>
      <div class="field"><label for="fDesc">الوصف</label><textarea id="fDesc" maxlength="600" placeholder="التفاصيل..."></textarea><div class="err" id="e-desc"></div></div>
      <button class="btn-gold" id="submitBtn" type="submit">نشر الإعلان</button>
    </form>
  </div>
</dialog>

<dialog id="detailDlg"><div class="dlg" id="detailBody"></div></dialog>

<dialog id="interestDlg">
  <div class="dlg">
    <div class="dlg-head"><h2>أنا مهتم بالمنتج</h2><button class="x" data-close="interestDlg" aria-label="إغلاق">×</button></div>
    <p class="note">سيتم إرسال اسمك ورقم واتساب إلى الوسيط، ليتواصل معك بشأن هذا الإعلان فقط.</p>
    <form id="interestForm" novalidate>
      <div class="field"><label for="intPhone">رقم واتساب</label><input id="intPhone" type="tel" dir="ltr" placeholder="0555123456"><div class="err" id="e-intPhone"></div></div>
      <label class="consent"><input type="checkbox" id="intConsent"> <span>أوافق على إرسال اسمي ورقم واتساب إلى الوسيط والبائع للتواصل بشأن هذا الإعلان فقط.</span></label>
      <div class="err" id="e-intConsent"></div>
      <button class="btn-gold" id="intBtn" type="submit">إرسال الطلب</button>
    </form>
  </div>
</dialog>

<dialog id="accountDlg">
  <div class="dlg">
    <div class="dlg-head"><h2>حسابي</h2><button class="x" data-close="accountDlg" aria-label="إغلاق">×</button></div>
    <div id="accountBody"></div>
  </div>
</dialog>

<dialog id="brokerDlg">
  <div class="dlg">
    <div class="dlg-head"><h2>طلبات المشترين</h2><button class="x" data-close="brokerDlg" aria-label="إغلاق">×</button></div>
    <div class="lead-bar">
      <select id="leadFilter">
        <option value="all">كل الطلبات</option>
        <option value="new">جديد</option>
        <option value="contacted">تم التواصل</option>
        <option value="sold">تم البيع</option>
        <option value="closed">مغلق</option>
      </select>
    </div>
    <div class="lead-stats" id="leadStats"></div>
    <div id="leadList"></div>

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1200;
      let w = img.width, h = img.height;
      if (w > max) { h = Math.round(h * max / w); w = max; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(b => {
        URL.revokeObjectURL(objectUrl);
        b ? resolve(new File([b], "image.jpg", { type: "image/jpeg" })) : reject(new Error("تعذر معالجة الصورة"));
      }, "image/jpeg", 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("الملف ليس صورة صالحة")); };
    img.src = objectUrl;
  });
}

async function uploadImage(file) {
  const compressed = await compressImage(file);
  const fd = new FormData();
  fd.append("file", compressed);
  fd.append("upload_preset", CLOUDINARY_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method: "POST", body: fd });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || !safeUrl(data.secure_url)) throw new Error("فشل رفع الصورة");
  return { url: data.secure_url };
}

function validatePost() {
  const title = $("fTitle").value.trim();
  const price = Number(toLatin($("fPrice").value).replace(/[\s,]/g, ""));
  const cat = $("fCat").value;
  const wilaya = $("fWilaya").value;
  const phone = normPhone($("fPhone").value);
  const desc = $("fDesc").value.trim();

  const commType = $("fCommType").value;
  const commVal = Number(toLatin($("fCommValue").value).replace(/[\s,]/g, ""));
  let commission = null;
  let commOk = true;
  if (commType) {
    const max = commType === "percent" ? 50 : (price > 0 ? price : 1e12);
    commOk = Number.isInteger(commVal) && commVal > 0 && commVal <= max;
    setErr("e-comm", commOk ? "" : (commType === "percent" ? "النسبة بين 1 و50" : "أدخل مبلغاً صحيحاً"));
    if (commOk) commission = { type: commType, value: commVal };
  } else {
    setErr("e-comm", "");
  }

  setErr("e-title", title.length < 3 ? "أدخل عنواناً من 3 أحرف على الأقل" : "");
  setErr("e-price", (!Number.isInteger(price) || price <= 0) ? "أدخل سعراً صحيحاً" : "");
  setErr("e-cat", CATS[cat] ? "" : "اختر التصنيف");
  setErr("e-wilaya", WILAYAS.includes(wilaya) ? "" : "اختر الولاية");
  setErr("e-phone", PHONE_RE.test(phone) ? "" : "رقم واتساب غير صحيح (مثال: 0555123456)");
  setErr("e-desc", desc.length > 600 ? "الوصف طويل جداً" : "");

  const ok = title.length >= 3 && Number.isInteger(price) && price > 0 && CATS[cat] && WILAYAS.includes(wilaya)
    && PHONE_RE.test(phone) && desc.length <= 600 && commOk;
  return ok ? { title, price, cat, wilaya, phone, desc, badge: $("fBadge").value, commission } : null;
}

async function submitPost(e) {

  const emailOk = /^\S+@\S+\.\S+$/.test(email);

  setErr("e-email", emailOk ? "" : "أدخل بريداً صحيحاً");
  setErr("e-pass", pass.length >= 6 ? "" : "كلمة المرور 6 أحرف على الأقل");
  if (authMode === "signup") setErr("e-name", name.length >= 2 ? "" : "أدخل اسمك (حرفان على الأقل)");
  if (!emailOk || pass.length < 6 || (authMode === "signup" && name.length < 2)) return;

  const btn = $("authBtn");
  btn.disabled = true;
  try {
    if (authMode === "signup") {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
    $("accountDlg").close();
    toast(authMode === "signup" ? "تم إنشاء الحساب بنجاح" : "مرحباً بك");
  } catch (err) {
    toast(authMessage(err));
  } finally {
    btn.disabled = false;
  }
}

onAuthStateChanged(auth, async user => {
  currentUser = user;
  isAdmin = false;
  stopLeads();
  stopMyCommissions();
  if (user) {
    try { isAdmin = (await getDoc(doc(db, "admins", user.uid))).exists(); } catch { isAdmin = false; }
    startMyCommissions();
  }
  startLeadsWatch();
  if (!$("accountDlg").open) renderAccount();
});

function openAccount() { authMode = "login"; renderAccount(); $("accountDlg").showModal(); }
function openPost() {
  if (!currentUser) { toast("الرجاء تسجيل الدخول أولاً"); return openAccount(); }
  $("postDlg").showModal();
}

$("grid").addEventListener("click", e => {
  const c = e.target.closest(".card");
  if (c) openDetail(c.dataset.id);
});
$("grid").addEventListener("keydown", e => {
  const c = e.target.closest(".card");
  if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDetail(c.dataset.id); }
});

$("cats").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]");
  if (!b) return;
  filter.cat = filter.cat === b.dataset.cat ? null : b.dataset.cat;
  renderAll();
});
$("clearCat").onclick = () => { filter.cat = null; renderAll(); };
$("clearAll").onclick = () => { filter = { cat: null, q: "" }; $("q").value = ""; renderAll(); };

$("q").addEventListener("input", e => { filter.q = e.target.value; renderGrid(); });
$("filterBtn").onclick = () => $("q").focus();

$("promoBanner").onclick = openPost;
$("navAdd").onclick = openPost;
$("navAccount").onclick = openAccount;
$("navHome").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
$("navCats").onclick = () => $("cats").scrollIntoView({ behavior: "smooth", block: "center" });
$("navChats").onclick = () => toast("المحادثات قريباً");
$("bellBtn").onclick = () => {
  if (isAdmin) { renderLeads(); $("brokerDlg").showModal(); }
  else toast("لا توجد إشعارات جديدة");
};
document.querySelector(".flag").onclick = () => toast("VEXORA MARKET 🇩🇿");

$("postForm").addEventListener("submit", submitPost);
$("interestForm").addEventListener("submit", submitInterest);
$("leadFilter").addEventListener("change", renderLeads);
$("leadList").addEventListener("change", changeLeadStatus);
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => $(b.dataset.close).close());

initPostSelects();
renderAll();
startSync();
</script>
</body>
</html>
