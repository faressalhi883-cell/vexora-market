<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071426">
<title>VEXORA MARKET | سوق جزائري بامتياز</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ألوان مطابقة للصورة (كحلي داكن + ذهبي) */
:root{
  --bg:#071426; --bg2:#040b16;
  --gold:#e8b854; --gold2:#c4922a;
  --gold-grad:linear-gradient(135deg,#f7d57a,#d49a22);
  --ink:#ffffff; --muted:#8fa1b5; --line:#1a3352;
  --wa:#25d366; --danger:#ef4444; --fb:#1877F2;
  --card-bg:#0c203b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:#02060c;color:var(--ink);min-height:100vh;display:flex;justify-content:center}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

.app{width:100%;max-width:440px;min-height:100vh;position:relative;padding-bottom:104px;overflow-x:hidden;
  background:linear-gradient(180deg, #0e2542 0%, var(--bg) 20%, var(--bg2) 100%)}

/* Header */
.top{direction:rtl;display:flex;align-items:center;justify-content:space-between;padding:15px 16px}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--gold);cursor:pointer}
.bell svg{width:28px;height:28px}
.count{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;border:2px solid var(--bg)}
.brand{display:flex;flex-direction:column;align-items:center;gap:5px}
.logo-wrap{width:70px;height:70px;border-radius:50%;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.4);border:2px solid var(--gold2);background:#0a1f38}
.logo-img{width:100%;height:100%;object-fit:cover}
.brand-title{font-size:20px;font-weight:900;color:var(--gold);text-align:center;line-height:1}
.brand-sub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.flag{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid #fff3;background:#fff;display:grid;place-items:center;font-size:24px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}

/* Search */
.search-area{padding:0 16px 12px}
.search-row{display:flex;gap:8px}
.search-box{flex:1;height:48px;background:#fff;border-radius:12px;display:flex;align-items:center;padding:0 14px;gap:8px}
.search-box input{flex:1;border:0;outline:0;font-family:inherit;font-size:15px;color:#111;background:transparent}
.search-box svg{color:#555}
.filter-btn{height:48px;padding:0 16px;border-radius:12px;background:var(--gold-grad);color:#000;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}

/* Quick Actions */
.quick-actions{display:flex;gap:8px;padding:0 16px 16px}
.qa-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#0c203b;border:1px solid var(--line);border-radius:12px;padding:10px 5px;font-size:13px;font-weight:700;color:#fff}
.qa-btn svg{color:var(--gold);width:18px;height:18px}

/* Categories */
.section-title{display:flex;justify-content:space-between;align-items:center;padding:0 16px 12px}
.section-title h2{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
.section-title h2::before{content:"";display:block;width:4px;height:18px;background:var(--gold);border-radius:2px}
.cats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px 16px}
.cat-card{background:#fdf4d8;border:1px solid var(--gold2);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 4px 8px rgba(0,0,0,.2)}
.cat-card svg{width:32px;height:32px;color:#0a1c33}
.cat-card span{font-size:12px;font-weight:800;color:#0a1c33;text-align:center}

/* Banner */
.banner-wrap{padding:0 16px 16px}
.banner-img{width:100%;border-radius:16px;border:2px solid var(--gold2);box-shadow:0 6px 15px rgba(0,0,0,.3);cursor:pointer;object-fit:cover;aspect-ratio:16/9}

/* Ads List (Horizontal Cards) */
.ads-list{display:flex;flex-direction:column;gap:12px;padding:0 16px}
.ad-card{background:#fff;border-radius:14px;display:flex;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15);cursor:pointer;position:relative}
.ad-img{width:120px;height:110px;background:#e0e0e0;flex-shrink:0}
.ad-img img{width:100%;height:100%;object-fit:cover}
.ad-content{padding:10px 12px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.ad-title{font-size:15px;font-weight:800;color:#111;line-height:1.3}
.ad-price{font-size:16px;font-weight:900;color:#c4922a}
.ad-price small{font-size:12px}
.ad-loc{font-size:12px;color:#666;display:flex;align-items:center;gap:4px;font-weight:600}
.ad-loc svg{width:12px;height:12px;color:var(--gold2)}

/* Bottom Nav */
.bnav{direction:ltr;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:70px;padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;z-index:100;
  background:#071426;border-top:1px solid var(--line);border-radius:20px 20px 0 0}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;flex:1}
.nav svg{width:22px;height:22px}
.nav.on{color:var(--gold)}
.add-btn{flex:0 0 auto;width:56px;height:56px;margin-top:-25px;border-radius:50%;background:var(--gold-grad);display:grid;place-items:center;color:#000;font-size:30px;font-weight:900;box-shadow:0 4px 12px rgba(232,184,84,.4);border:4px solid #071426;cursor:pointer;line-height:1}

/* Dialogs & Forms (نفس الكود السابق) */
dialog{border:0;border-radius:20px;padding:0;width:calc(100% - 24px);max-width:440px;max-height:88vh;background:#0c203b;color:#fff;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.8);backdrop-filter:blur(4px)}
.dlg{padding:18px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dlg-head h2{font-size:18px;font-weight:900}
.x{width:32px;height:32px;border-radius:50%;background:var(--line);font-size:20px;display:grid;place-items:center}
.field{margin-bottom:12px}
.field label{display:block;font-weight:700;margin-bottom:5px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#071426;color:#fff;font-family:inherit;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[type=file]{padding:8px}
input[type=checkbox]{width:auto;accent-color:var(--gold)}
textarea{resize:vertical;min-height:80px}
select option{background:#071426}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#ff7b7b;font-size:12px;margin-top:4px;min-height:1em}
.btn-gold{display:block;width:100%;padding:12px;border-radius:10px;background:var(--gold-grad);color:#000;font-weight:900;font-size:15px;text-align:center;margin-top:8px}
.btn-gold:disabled{opacity:.6}
.btn-interest{display:block;width:100%;padding:12px;border-radius:10px;background:var(--gold-grad);color:#000;font-weight:900;font-size:15px;margin-bottom:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab{padding:10px;border-radius:10px;background:var(--line);font-weight:800;color:var(--muted);font-size:13px}
.tab.on{background:var(--gold-grad);color:#000}
.detail-img{width:100%;height:220px;border-radius:12px;margin-bottom:12px;object-fit:cover}
.d-price{color:var(--gold);font-size:22px;font-weight:900;direction:ltr;text-align:right;margin-bottom:6px}
.d-meta{color:var(--muted);margin-bottom:10px;font-size:13px}
.d-desc{line-height:1.6;margin-bottom:16px;font-size:14px;white-space:pre-wrap}
.lead{background:var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.lead h4{font-size:15px;font-weight:800;margin-bottom:6px}
.lead-meta{font-size:12px;color:var(--muted);margin-bottom:4px}
.lead-links{display:flex;gap:8px;margin:8px 0}
.lead-links a{flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--wa);color:#fff;font-weight:800;font-size:12px}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,30px);background:#fff;color:#111;padding:10px 20px;border-radius:20px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;z-index:300;font-size:13px;}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="app">

  <!-- Categories -->
  <div class="section-title"><h2>التصنيفات الرئيسية</h2></div>

    <div class="cat-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg><span>إلكترونيات</span></div>

<!-- Dialogs (نفس النوافذ السابقة) -->
<dialog id="postDlg">

        <div class="field"><label>التصنيف</label><select id="fCat"></select></div>
      </div>
      <div class="row">
        <div class="field"><label>الولاية</label><select id="fWilaya"></select></div>

<dialog id="accountDlg">

    <div id="accountBody"></div>
  </div>
</dialog>

<dialog id="brokerDlg">
  <div class="dlg">
    <div class="dlg-head"><h2>لوحة الوسيط (طلبات المشترين)</h2><button class="x" data-close="brokerDlg">×</button></div>
    <select id="leadFilter" style="margin-bottom:12px"><option value="all">كل الطلبات</option><option value="new">جديد</option><option value="contacted">تم التواصل</option><option value="sold">تم البيع</option></select>
    <div id="leadList"></div>
  </div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDdELO4JQ3-Iq05pYdWAG8r85fdSkCGu3g",
  authDomain: "vexora-market-b47d3.firebaseapp.com",
  projectId: "vexora-market-b47d3",
  storageBucket: "vexora-market-b47d3.firebasestorage.app",
  messagingSenderId: "436842314999",
  appId: "1:436842314999:web:aa85296209d34e019c67f2"
};
const CLOUDINARY_CLOUD_NAME = "jlbxufzi";
const CLOUDINARY_PRESET = "vexora_preset";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const PHONE_RE = /^213[5-7]\d{8}$/;
const CATS = { auto:{label:"سيارات"}, realestate:{label:"عقارات"}, electronics:{label:"إلكترونيات"}, goods:{label:"السلع العامة"}, livestock:{label:"المواشي"}, services:{label:"الخدمات"}, jobs:{label:"الوظائف"}, home:{label:"المنزل"} };
const BADGES = { featured:{label:"⭐ مميز",cls:"b-feat"}, urgent:{label:"🔥 عاجل",cls:"b-urg"}, sale:{label:"للبيع",cls:"b-sale"} };
const WILAYAS = ["أدرار","الشلف","الأغواط","أم البواقي","باتنة","بجاية","بسكرة","بشار","البليدة","البويرة","تمنراست","تبسة","تلمسان","تيارت","تيزي وزو","الجزائر","الجلفة","جيجل","سطيف","سعيدة","سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة","المدية","مستغانم","المسيلة","معسكر","ورقلة","وهران","البيض","إليزي","برج بوعريريج","بومرداس","الطارف","تندوف","تيسمسيلت","الوادي","خنشلة","سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة","عين تموشنت","غرداية","غليزان"];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n||0).toLocaleString("en-US");
const toLatin = s => String(s??"").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
const normPhone = raw => { let p = toLatin(raw).replace(/[\s\-+()]/g, ""); if (p.startsWith("0")) p = "213" + p.slice(1); return p; };
const setErr = (id, msg) => { $(id).textContent = msg || ""; };

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2500); }

let currentUser = null, isAdmin = false, listings = [], leads = [], myCommissions = {};
let unsubLeads = null, unsubCommissions = null, currentInterest = null, filter = { cat: null, q: "" };

// بطاقة إعلان أفقية (مثل الصورة)
function cardHTML(l) {
  const b = BADGES[l.badge], img = l.media?.url ? `<img src="${esc(l.media.url)}" loading="lazy">` : `<div style="width:100%;height:100%;display:grid;place-items:center;font-size:30px;background:#ccc">🏷️</div>`;
  return `
    <article class="ad-card" data-id="${esc(l.id)}">
      <div class="ad-img">${img}</div>
      <div class="ad-content">
        ${b ? `<span style="position:absolute;top:8px;right:8px;font-size:10px;background:var(--gold);color:#000;padding:2px 6px;border-radius:4px;font-weight:800">${b.label}</span>` : ""}
        <div class="ad-title">${esc(l.title)}</div>
        <div class="ad-price">${fmt(l.price)} <small>د.ج</small></div>
        <div class="ad-loc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ${esc(l.wilaya)}</div>
      </div>
    </article>`;
}

function renderGrid() {
  const term = filter.q.trim().toLowerCase();
  const items = listings.filter(l => (!filter.cat || l.cat === filter.cat) && (!term || l.title.toLowerCase().includes(term)));
  $("grid").innerHTML = items.length ? items.map(cardHTML).join("") : `<div style="text-align:center;color:var(--muted);padding:20px">لا توجد إعلانات</div>`;
}

function startSync() {
  onSnapshot(query(collection(db, "listings"), orderBy("createdAt", "desc"), limit(50)), snap => {
    listings = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.title && PHONE_RE.test(l.phone || ""));
    renderGrid();
  });
}

function openDetail(id) {
  const l = listings.find(x => x.id === id); if (!l) return;
  const url = l.media?.url, isOwner = currentUser && l.sellerId === currentUser.uid, myComm = isOwner ? myCommissions[l.id] : null;
  $("detailBody").innerHTML = `
    <div class="dlg-head"><h2>${esc(l.title)}</h2><button class="x" id="closeDetail">×</button></div>
    <img src="${url || ''}" class="detail-img" style="display:${url?'block':'none'}">
    <div class="d-price">${fmt(l.price)} د.ج</div>
    <div class="d-meta">📍 ${esc(l.wilaya)} • ${esc(CATS[l.cat]?.label || "")}</div>
    ${myComm ? `<div style="background:#3a2a06;color:#ffd77a;padding:8px;border-radius:8px;font-size:13px;margin-bottom:10px">عمولتك: ${myComm.type === 'percent' ? myComm.value+'%' : fmt(myComm.value)+' د.ج'}</div>` : ""}
    <p class="d-desc">${esc(l.desc || "")}</p>
    ${!isOwner ? `<button class="btn-interest" id="interestBtn">أنا مهتم (اطلب المنتج)</button>` : ""}
    ${isAdmin || isOwner ? `<button class="btn-gold" style="background:#ef4444;color:#fff" id="deleteBtn">حذف الإعلان</button>` : ""}`;
  $("closeDetail").onclick = () => $("detailDlg").close();
  if ($("interestBtn")) $("interestBtn").onclick = () => openInterest(l.id);
  if ($("deleteBtn")) $("deleteBtn").onclick = async () => { if(confirm("حذف؟")) { await deleteDoc(doc(db, "listings", l.id)); deleteDoc(doc(db,"private_commissions",l.id)).catch(()=>{}); $("detailDlg").close(); toast("تم الحذف"); } };
  $("detailDlg").showModal();
}

function openInterest(id) {
  if (!currentUser) { toast("سجّل الدخول أولاً"); return openAccount(); }
  const l = listings.find(x => x.id === id); if(l.sellerId === currentUser.uid) return;
  currentInterest = l; $("intPhone").value = ""; $("intConsent").checked = false; setErr("e-intPhone",""); setErr("e-intConsent","");
  $("detailDlg").close(); $("interestDlg").showModal();
}

async function submitInterest(e) {
  e.preventDefault(); const phone = normPhone($("intPhone").value);
  if (!PHONE_RE.test(phone)) return setErr("e-intPhone", "رقم غير صحيح");
  if (!$("intConsent").checked) return setErr("e-intConsent", "وافق على الشروط");
  $("intBtn").disabled = true;
  try {
    await setDoc(doc(db, "leads", `${currentInterest.id}_${currentUser.uid}`), {
      listingId: currentInterest.id, listingTitle: currentInterest.title, listingPrice: currentInterest.price,
      sellerId: currentInterest.sellerId, sellerPhone: currentInterest.phone, sellerCCP: currentInterest.ccp || "—",
      buyerId: currentUser.uid, buyerName: currentUser.displayName || "مشتري", buyerPhone: phone,
      consent: true, status: "new", createdAt: serverTimestamp()
    });
    $("interestDlg").close(); toast("تم إرسال طلبك للوسيط");
  } catch { toast("تعذر الإرسال"); } finally { $("intBtn").disabled = false; }
}

function stopLeads() { if(unsubLeads){unsubLeads();unsubLeads=null;} leads=[]; $("bellCount").style.display="none"; }
function startLeadsWatch() {
  if (!isAdmin) return stopLeads();
  unsubLeads = onSnapshot(query(collection(db, "leads"), orderBy("createdAt", "desc"), limit(100)), snap => {
    leads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const n = leads.filter(l => l.status === "new").length;
    $("bellCount").textContent = n; $("bellCount").style.display = n > 0 ? "grid" : "none";
    if ($("brokerDlg").open) renderLeads();
  });
}

function renderLeads() {
  const f = $("leadFilter").value, rows = leads.filter(l => f === "all" || l.status === f);
  $("leadList").innerHTML = rows.length ? rows.map(l => `
    <div class="lead">
      <h4>${esc(l.listingTitle)}</h4>
      <div class="lead-meta">المشتري: <b>${esc(l.buyerName)}</b> (${esc(l.buyerPhone)})</div>
      <div class="lead-meta" style="color:#ffd77a">CCP البائع: ${esc(l.sellerCCP)}</div>
      <div class="lead-links"><a href="https://wa.me/${esc(l.buyerPhone)}" target="_blank">واتساب المشتري</a><a href="https://wa.me/${esc(l.sellerPhone)}" target="_blank">واتساب البائع</a></div>
    </div>`).join("") : `<div style="color:var(--muted);text-align:center;padding:20px">لا توجد طلبات</div>`;
}

async function submitPost(e) {
  e.preventDefault(); if (!currentUser) return toast("سجّل الدخول");
  const title = $("fTitle").value.trim(), price = Number(toLatin($("fPrice").value).replace(/\D/g,"")), phone = normPhone($("fPhone").value);
  if (title.length < 3 || !price || !PHONE_RE.test(phone)) return toast("تأكد من البيانات");
  $("submitBtn").disabled = true;
  try {
    let media = null; const file = $("fMedia").files[0];
    if (file) {
      const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", CLOUDINARY_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method:"POST", body:fd });
      const data = await res.json(); if(data.secure_url) media = { url: data.secure_url };
    }
    const ref = await addDoc(collection(db, "listings"), {
      title, price, cat:$("fCat").value, wilaya:$("fWilaya").value, phone, ccp:$("fCCP").value, desc:$("fDesc").value,
      badge:$("fBadge").value||null, media, sellerId:currentUser.uid, sellerName:currentUser.displayName||"بائع", createdAt:serverTimestamp()
    });
    if ($("fCommType").value) {
      await setDoc(doc(db, "private_commissions", ref.id), { sellerId:currentUser.uid, type:$("fCommType").value, value:Number($("fCommValue").value) });
    }
    $("postForm").reset(); $("postDlg").close(); toast("تم النشر");
  } catch { toast("تعذر النشر"); } finally { $("submitBtn").disabled = false; }
}

function renderAccount() {
  const b = $("accountBody");
  if (currentUser) {
    b.innerHTML = `<p style="margin-bottom:15px">مرحباً، <b>${esc(currentUser.displayName||"مستخدم")}</b></p>
      ${isAdmin ? `<button class="btn-gold" id="adminBtn" style="margin-bottom:10px">لوحة الوسيط (الطلبات)</button>` : ""}
      <a href="https://www.facebook.com/VEXORA_MARKET_PAGE" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:8px;background:var(--fb);color:#fff;padding:12px;border-radius:10px;font-weight:800;margin-bottom:10px;font-size:14px"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg> صفحتنا على فيسبوك</a>
      <button class="btn-gold" id="logoutBtn" style="background:var(--line);color:#fff">خروج</button>`;
    $("logoutBtn").onclick = () => { signOut(auth); $("accountDlg").close(); };
    if ($("adminBtn")) $("adminBtn").onclick = () => { $("accountDlg").close(); renderLeads(); $("brokerDlg").showModal(); };
    return;
  }
  b.innerHTML = `<form id="authForm"><div class="field"><label>البريد</label><input id="authEmail" type="email" dir="ltr"></div><div class="field"><label>كلمة المرور</label><input id="authPass" type="password" dir="ltr"></div><button class="btn-gold" type="submit">دخول / إنشاء</button></form>`;
  $("authForm").onsubmit = async (e) => {
    e.preventDefault();
    try { await signInWithEmailAndPassword(auth, $("authEmail").value, $("authPass").value).catch(async() => { await createUserWithEmailAndPassword(auth, $("authEmail").value, $("authPass").value); }); $("accountDlg").close(); }
    catch { toast("خطأ"); }
  };
}

onAuthStateChanged(auth, async u => {
  currentUser = u; isAdmin = false; stopLeads();
  if (u) { try { isAdmin = (await getDoc(doc(db, "admins", u.uid))).exists(); } catch {} }
  startLeadsWatch(); if (!$("accountDlg").open) renderAccount();
});

$("grid").onclick = e => { const c = e.target.closest(".ad-card"); if(c) openDetail(c.dataset.id); };
$("q").oninput = e => { filter.q = e.target.value; renderGrid(); };
$("navAdd").onclick = () => { if(currentUser) $("postDlg").showModal(); else openAccount(); };
$("navAccount").onclick = openAccount;
$("bellBtn").onclick = () => { if(isAdmin) { renderLeads(); $("brokerDlg").showModal(); } else toast("لا إشعارات"); };
$("postForm").onsubmit = submitPost;
$("interestForm").onsubmit = submitInterest;
$("leadFilter").onchange = renderLeads;
document.querySelectorAll("[data-close]").forEach(el => el.onclick = () => $(el.dataset.close).close());

// Init
Object.entries(CATS).forEach(([k,v]) => $("fCat").add(new Option(v.label, k)));
WILAYAS.forEach(w => $("fWilaya").add(new Option(w, w)));
startSync();
</script>
</body>
</html>
